plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.fa'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.fa"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "10.0-agent-execution"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
