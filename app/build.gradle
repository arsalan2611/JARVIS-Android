plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.fa'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.fa"
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName "1.0-final"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
