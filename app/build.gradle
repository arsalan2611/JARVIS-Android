plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.fa'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.fa"
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName "1.0-unified-command-center"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
