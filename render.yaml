services:
  - type: web
    name: jarvis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JARVIS_BACKEND_HOST
        value: 0.0.0.0
      - key: JARVIS_BACKEND_PORT
        value: 8080
      - key: JARVIS_BACKEND_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
